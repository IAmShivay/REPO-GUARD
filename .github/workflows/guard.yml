name: repo-guard

on:
  workflow_dispatch:
    inputs:
      lookback_minutes:
        description: How far back to check repo activity, in minutes
        default: "1440"

permissions:
  contents: read
  issues: write

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 guard.py
        env:
          GH_TOKEN: ${{ github.token }}
          LOOKBACK_MINUTES: ${{ inputs.lookback_minutes }}
