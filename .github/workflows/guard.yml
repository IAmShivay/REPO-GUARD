name: repo-guard

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: write

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 guard.py
        env:
          GH_TOKEN: ${{ github.token }}
      - name: keep schedule alive
        if: always()
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/guard.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
